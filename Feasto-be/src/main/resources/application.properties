
# Application-Specific Properties (Optional)
feasto.app.name=Feasto
feasto.app.version=1.0.0

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Cloudinary Configuration
# Cloudinary Configuration (Set these in Environment Variables for Production)
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:dp80vdscp}
cloudinary.api_key=${CLOUDINARY_API_KEY:393666567494525}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:ZJ5USGdTVx98XdsbpSuRVrmqTkI}

#image size in mb
img.max.size=5

# File Upload Configuration
spring.servlet.multipart.max-file-size=${img.max.size}MB
spring.servlet.multipart.max-request-size=${img.max.size}MB
spring.servlet.multipart.enabled=true


# Database Configuration (mysql8)
# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/feasto?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Springdoc OpenAPI (Swagger) Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packagesToScan=com.feasto.controller
springdoc.default-produces-media-type=application/json
logging.level.org.springdoc=DEBUG

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.feasto=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Hibernate second-level cache settings
# Set both javax (legacy) and jakarta (Hibernate 6+) to suppress missing-cache warnings
spring.jpa.properties.hibernate.jakarta.cache.missing_cache_strategy=create
spring.jpa.properties.hibernate.javax.cache.missing_cache_strategy=create

spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.cache.jcache.config=classpath:ehcache.xml
spring.application.name=Feasto
# Security Configuration
feasto.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
feasto.jwt.expiration=86400000
